<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>祥龙 XIANGLONG</title>

<script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>

<style>
body{
  margin:0;
  overflow-x:hidden;
  background:#050508;
  color:#fff;
  font-family: system-ui, Inter;
}

/* ===== CANVAS ===== */
canvas{
  position:fixed;
  top:0;
  left:0;
  z-index:0;
}

/* ===== OVERLAY UI ===== */
.overlay{
  position:relative;
  z-index:2;
}

/* HERO */
.hero{
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  text-align:center;
}

.hero h1{
  font-size:90px;
  letter-spacing:20px;
  font-weight:800;
  text-shadow:0 0 40px rgba(255,200,80,0.3);
}

.hero p{
  opacity:0.7;
  letter-spacing:6px;
}

/* SECTION */
.section{
  min-height:100vh;
  padding:120px 12%;
  display:flex;
  flex-direction:column;
  justify-content:center;
}

.title{
  font-size:46px;
  margin-bottom:20px;
}

.sub{
  max-width:700px;
  opacity:0.75;
  line-height:1.8;
}

/* FLOAT GLOW */
.glow{
  position:absolute;
  width:600px;
  height:600px;
  background:radial-gradient(circle, rgba(255,200,80,0.25), transparent 60%);
  filter:blur(60px);
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  pointer-events:none;
}
</style>
</head>

<body>

<canvas id="c"></canvas>

<div class="overlay">

  <section class="hero">
    <div class="glow"></div>
    <h1 id="title">祥龙</h1>
    <p>XIANG LONG · SYSTEM OF ASCENT</p>
  </section>

  <section class="section">
    <div class="title">不是品牌，是“势能系统”</div>
    <div class="sub">
      祥龙不是视觉设计，而是一种结构化增长引擎。
      它将商业、AI与文化压缩为一个持续上升的动态系统。
    </div>
  </section>

  <section class="section">
    <div class="title">投资人看到的不是产品，而是轨迹</div>
    <div class="sub">
      每一次交互都会改变系统状态。
      每一个用户都是“龙势网络”的节点。
    </div>
  </section>

</div>

<script>
// =====================
// THREE.JS SCENE
// =====================
const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
  60,
  window.innerWidth/window.innerHeight,
  0.1,
  1000
);

camera.position.z = 6;

const renderer = new THREE.WebGLRenderer({
  canvas: document.querySelector("#c"),
  alpha:true
});

renderer.setSize(window.innerWidth, window.innerHeight);

// =====================
// PARTICLE FIELD (DRAGON ENERGY)
// =====================
const geometry = new THREE.BufferGeometry();
const count = 6000;

const positions = new Float32Array(count * 3);

for(let i=0;i<count;i++){
  positions[i*3] = (Math.random()-0.5)*20;
  positions[i*3+1] = (Math.random()-0.5)*20;
  positions[i*3+2] = (Math.random()-0.5)*20;
}

geometry.setAttribute("position", new THREE.BufferAttribute(positions,3));

const material = new THREE.PointsMaterial({
  size:0.02,
  color:0xffcc66,
  transparent:true,
  opacity:0.7
});

const points = new THREE.Points(geometry, material);
scene.add(points);

// =====================
// MOUSE INTERACTION FIELD
// =====================
let mouseX = 0;
let mouseY = 0;

document.addEventListener("mousemove",(e)=>{
  mouseX = (e.clientX / window.innerWidth - 0.5) * 2;
  mouseY = (e.clientY / window.innerHeight - 0.5) * 2;
});

// =====================
// ANIMATION LOOP
// =====================
function animate(){
  requestAnimationFrame(animate);

  points.rotation.y += 0.0008;
  points.rotation.x += 0.0003;

  // mouse influence (energy field bend)
  points.rotation.y += mouseX * 0.002;
  points.rotation.x += mouseY * 0.002;

  renderer.render(scene, camera);
}

animate();

// =====================
// RESIZE
// =====================
window.addEventListener("resize",()=>{
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// =====================
// KEYNOTE STYLE TEXT ANIMATION
// =====================
gsap.from("#title",{
  opacity:0,
  y:40,
  duration:1.5,
  ease:"power3.out"
});

gsap.utils.toArray(".section").forEach((sec)=>{
  gsap.from(sec,{
    opacity:0,
    y:80,
    duration:1,
    scrollTrigger:{
      trigger:sec,
      start:"top 80%"
    }
  });
});
</script>

</body>
</html>
